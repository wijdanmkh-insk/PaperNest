<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Papernest</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
    </head>

    <body>
        <div class="container">
            <nav>
                <div class="logo">
                    <img src="/assets/logo.png" alt="Papernest logo" width="100px">
                </div>

                <div class="nav-links">
                    <ul>
                        <li>About</li>
                        <li>Products</li>
                        <li>Contact</li>
                    </ul>   
                </div>
                
                <div class="logs">
                    <div class="sign-in">
                        Sign In
                    </div>
                    <div class="sign-up">
                        Sign Up
                    </div>
                </div>
            </nav>
        </div>

        <div class="hero">
            <div class="col-2">
                <h1>Let your Imagination Flow</h1>
                <p>Discover the power of your overflowing imaginations coming out!</p>
            </div>
            <div class="col-2">
                <img src="assets/hero.png" alt="Hero image">
            </div>
        </div>
    </body>
        

</html>
